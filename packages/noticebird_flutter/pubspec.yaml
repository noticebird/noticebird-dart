name: noticebird_flutter
description: Noticebird for Flutter apps — one start installs crash reporting, breadcrumbs, offline delivery and user feedback.
version: 0.4.0
publish_to: 'none'
resolution: workspace
repository: https://github.com/noticebird/noticebird-dart
homepage: https://noticebird.com

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  bloc: ^9.2.0
  connectivity_plus: '>=6.0.0 <8.0.0'
  flutter:
    sdk: flutter
  http: ^1.6.0
  noticebird: ^0.4.0
  package_info_plus: '>=8.0.0 <11.0.0'
  path_provider: ^2.1.0

dev_dependencies:
  connectivity_plus_platform_interface: ^2.0.0
  fake_async: ^1.3.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  package_info_plus_platform_interface: '>=3.0.0 <5.0.0'
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0
