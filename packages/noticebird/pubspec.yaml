name: noticebird
description: Privacy-safe crash reporting and user feedback for Dart, the client of Noticebird. A Flutter app starts it with noticebird_flutter.
version: 0.4.0
publish_to: 'none'
resolution: workspace
repository: https://github.com/noticebird/noticebird-dart
homepage: https://noticebird.com

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  noticebird_protocol: ^0.4.0
  crypto: ^3.0.6
  http: ^1.6.0
  meta: ^1.15.0

dev_dependencies:
  fake_async: ^1.3.1
  json_schema: ^5.2.2
  lints: ^5.0.0
  test: ^1.25.0
