name: noticebird
description: Privacy-safe Flutter crash capture SDK for Noticebird.
version: 0.3.0
publish_to: 'none'
resolution: workspace
repository: https://github.com/noticebird/noticebird-dart
homepage: https://noticebird.com

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  bloc: ^9.0.0
  noticebird_protocol: ^0.3.0
  crypto: ^3.0.6
  http: ^1.6.0

dev_dependencies:
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_schema: ^5.2.2

flutter:
  uses-material-design: false
