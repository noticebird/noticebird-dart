name: noticebird_native
description: Native crash capture for noticebird — iOS MetricKit and Android ApplicationExitInfo reports of earlier runs, delivered as protocol events.
version: 0.6.0
publish_to: 'none'
resolution: workspace
repository: https://github.com/noticebird/noticebird-dart
homepage: https://noticebird.com

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  noticebird: ^0.6.0
  noticebird_protocol: ^0.6.0
  flutter:
    sdk: flutter

dev_dependencies:
  fake_async: ^1.3.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.noticebird.nativecrashes
        pluginClass: NoticebirdNativePlugin
      ios:
        pluginClass: NoticebirdNativePlugin
